name: Cross-platform release candidates

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml
    with:
      skip-artifact-upload: false

  publish:
    name: Attach approved binaries to GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
    needs: [build-and-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v8
        with:
          pattern: opengrads-*
          path: artifacts
          merge-multiple: true

      - name: Check the tag matches the distribution version
        run: |
          dist_version="$(cat release/VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${dist_version}" ]]; then
            printf 'Tag %s does not match release/VERSION (%s).\n' \
              "${GITHUB_REF_NAME}" "${dist_version}" >&2
            exit 1
          fi

      - name: Prepare notes for this version only
        run: |
          python3 release/release_notes.py \
            --version "$(cat release/VERSION)" \
            --output "${RUNNER_TEMP}/release-notes.md"

      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "opengrads-hpc $(cat release/VERSION)" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --repo "${GITHUB_REPOSITORY}"

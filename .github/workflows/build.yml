name: Cross-platform build and test

on:
  workflow_call:
    inputs:
      skip-artifact-upload:
        description: Skip uploading binary artifacts when running CI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-22.04-arm
            artifact: linux-aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    # Built inside AlmaLinux 8 (glibc 2.28) rather than on the Ubuntu 22.04
    # runner (glibc 2.35). glibc is forward-compatible only, so a 2.35 build
    # cannot run on the RHEL 8 family that HPC clusters are still on.
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Select manylinux Python 3.11
        run: |
          python_dir=/opt/python/cp311-cp311/bin
          if [ ! -x "$python_dir/python3" ]; then
            printf 'Required manylinux Python 3.11 is missing: %s\n' "$python_dir" >&2
            exit 1
          fi
          printf '%s\n' "$python_dir" >> "$GITHUB_PATH"
          "$python_dir/python3" --version

      - name: Install build prerequisites
        run: |
          dnf -y install epel-release
          dnf config-manager --set-enabled powertools || \
            dnf config-manager --set-enabled crb || true
          dnf -y install \
            autoconf automake libtool make gawk pkgconf-pkg-config cmake curl tar \
            python3 \
            cairo-devel libX11-devel libXext-devel libXmu-devel libICE-devel \
            libSM-devel libgeotiff-devel libtiff-devel hdf5-devel \
            libjpeg-turbo-devel netcdf-devel udunits2-devel zlib-devel

      - name: Check release notes and built-in function catalog
        run: |
          python3 -c 'import sys; print(sys.executable); print(sys.version); assert sys.version_info[:2] == (3, 11)'
          python3 pytests/TestReleaseNotes.py
          python3 pytests/check_function_catalog.py

      - name: Build, test, and package
        env:
          OPENGRADS_BUILD_JOBS: 4
        run: |
          command -v python3
          python3 --version
          ./release/build-release.sh

      - name: Verify archive
        run: |
          cd release-dist
          sha256sum -c -- *.sha256
          for archive in *.tar.gz; do
            tar -tzf "$archive"
          done | sed -n '1,80p'

      - name: Upload approved binary artifact
        if: ${{ !inputs.skip-artifact-upload && vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: opengrads-${{ matrix.artifact }}
          path: |
            release-dist/*.tar.gz
            release-dist/*.sha256
          if-no-files-found: error

  macos:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build prerequisites
        env:
          # Without this, brew also upgrades the formulas the runner image
          # already has that happen to depend on something we pull in. On
          # macos-15 that cascade upgraded openssl@3 and then failed to link
          # it over the image's openssl@1.1 symlink, failing the whole step
          # before anything of ours was built.
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew update
          brew install adios2 autoconf automake cairo coreutils gcc libgeotiff hdf5 \
            libomp libtool libx11 libxext libxmu netcdf pkgconf readline udunits
          # tmux lets the terminal display's tests draw into a tmux pane.
          brew install tmux
          # XQuartz's Xvfb lets the packager draw with the X displays.
          brew install --cask xquartz

      - name: Check release notes and built-in function catalog
        run: |
          python3 -c 'import sys; print(sys.executable); print(sys.version); assert sys.version_info[:2] == (3, 11)'
          python3 pytests/TestReleaseNotes.py
          python3 pytests/check_function_catalog.py

      - name: Build, test, and package
        env:
          OPENGRADS_BUILD_JOBS: 4
        run: ./release/build-release-macos.sh

      - name: Verify archive
        run: |
          cd release-dist
          shasum -a 256 -c -- *.sha256
          for archive in *.tar.gz; do
            tar -tzf "$archive"
          done | sed -n '1,80p'

      - name: Upload approved binary artifact
        if: ${{ !inputs.skip-artifact-upload && vars.BINARY_REDISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: opengrads-${{ matrix.artifact }}
          path: |
            release-dist/*.tar.gz
            release-dist/*.sha256
          if-no-files-found: error
